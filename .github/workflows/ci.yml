name: CI

on:
  push:
    branches: [main, feat/v0.4-complete-conversion-quality]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Pandoc for real document E2E tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pandoc
          pandoc --version | head -n 1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,all]"

      - name: Lint with ruff
        run: ruff check devkit/ tests/

      - name: Run tests
        run: pytest tests/ -v --tb=short -m 'not pdf_integration and not visual_integration'

  pdf-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install real PDF rendering backends and CJK fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pandoc libreoffice-writer fontconfig fonts-noto-cjk
          pandoc --version | head -n 1
          libreoffice --version
          fc-match -f '%{family}\n%{file}\n%{index}\n' 'Noto Sans CJK SC'

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,all]"

      - name: Real CJK PDF generation and raster regression tests
        run: pytest tests/test_pdf_v04c.py -v --tb=short -m pdf_integration

  visual-golden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install pinned-OS document renderer and CJK fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pandoc libreoffice-writer fontconfig fonts-noto-cjk

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,all]"

      - name: Verify separately approved visual golden references
        run: |
          python -m devkit.convert.visual_cli verify \
            --manifest tests/fixtures/visual_v04d/manifest.json \
            --out-dir "$RUNNER_TEMP/visual-golden-verification"

      - name: Verify real PDF golden suite through pytest
        run: pytest tests/test_visual_v04d.py -v --tb=short -m visual_integration

      - name: Upload report, actual images and red-highlighted diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-golden-report
          path: ${{ runner.temp }}/visual-golden-verification/
          if-no-files-found: warn
